<!DOCTYPE html>
<html lang="en">

<head>
  <!-- Required meta tags -->
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="CryptoFinder - Discover the latest cryptocurrency tokens and coins" />

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />

  <!-- Font Awesome Icons -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" />

  <!-- Google Fonts - Inter for modern, clean typography -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet" />

  <!-- Custom Styles -->
  <style>
    /* ===== Design Tokens ===== */
    :root {
      /* Color Palette - Modern Crypto Theme */
      --color-primary: #0ea5e9;
      --color-primary-dark: #0284c7;
      --color-primary-light: #38bdf8;
      --color-secondary: #8b5cf6;
      --color-accent: #10b981;

      /* Neutrals */
      --color-white: #ffffff;
      --color-dark: #0f172a;
      --color-gray-50: #f8fafc;
      --color-gray-100: #f1f5f9;
      --color-gray-200: #e2e8f0;
      --color-gray-300: #cbd5e1;
      --color-gray-400: #94a3b8;
      --color-gray-500: #64748b;
      --color-gray-600: #475569;
      --color-gray-700: #334155;
      --color-gray-800: #1e293b;

      /* Semantic Colors */
      --color-success: #10b981;
      --color-warning: #f59e0b;
      --color-danger: #ef4444;
      --color-info: #0ea5e9;

      /* Spacing Scale */
      --space-xs: 0.25rem;
      --space-sm: 0.5rem;
      --space-md: 1rem;
      --space-lg: 1.5rem;
      --space-xl: 2rem;
      --space-2xl: 3rem;
      --space-3xl: 4rem;

      /* Typography */
      --font-family-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --font-family-display: 'Poppins', var(--font-family-sans);

      /* Border Radius */
      --radius-sm: 0.375rem;
      --radius-md: 0.5rem;
      --radius-lg: 0.75rem;
      --radius-xl: 1rem;
      --radius-full: 9999px;

      /* Shadows */
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
      --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
    }

    /* ===== Global Styles ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: var(--font-family-sans);
      color: var(--color-gray-700);
      background-color: var(--color-gray-50);
      line-height: 1.6;
      font-size: 1rem;
    }

    /* Typography */
    h1, h2, h3, h4, h5, h6 {
      font-family: var(--font-family-display);
      font-weight: 700;
      color: var(--color-dark);
      line-height: 1.2;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: var(--space-xl);
    }

    h2 {
      font-size: 2rem;
      margin-bottom: var(--space-lg);
    }

    h3 {
      font-size: 1.5rem;
      margin-bottom: var(--space-md);
    }

    h4 {
      font-size: 1.25rem;
      margin-bottom: var(--space-sm);
    }

    h5, h6 {
      font-size: 1rem;
      margin-bottom: var(--space-sm);
    }

    p {
      margin-bottom: var(--space-md);
    }

    a {
      color: var(--color-primary);
      text-decoration: none;
      transition: color 0.2s ease;
    }

    a:hover {
      color: var(--color-primary-dark);
      text-decoration: underline;
    }

    /* ===== Navbar ===== */
    .navbar {
      background: var(--color-dark);
      border-bottom: 2px solid var(--color-primary);
      padding: var(--space-md) 0;
      box-shadow: var(--shadow-md);
    }

    .navbar-brand {
      font-family: var(--font-family-display);
      font-size: 1.5rem;
      font-weight: 700;
      background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-primary-light) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-right: var(--space-xl);
      letter-spacing: -0.5px;
    }

    .navbar-nav {
      gap: var(--space-lg);
    }

    .nav-link {
      font-weight: 500;
      color: var(--color-gray-100) !important;
      position: relative;
      transition: color 0.2s ease;
      display: flex;
      align-items: center;
      gap: var(--space-sm);
    }

    .nav-link:hover {
      color: var(--color-primary-light) !important;
    }

    .nav-link::after {
      content: '';
      position: absolute;
      bottom: -8px;
      left: 0;
      width: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--color-primary), var(--color-primary-light));
      transition: width 0.3s ease;
    }

    .nav-link:hover::after {
      width: 100%;
    }

    .navbar-toggler {
      border: none;
      padding: var(--space-sm) var(--space-md);
    }

    .navbar-toggler:focus {
      box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.3);
      outline: none;
    }

    .navbar-toggler-icon {
      background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 30'%3e%3cpath stroke='rgba(255,255,255,0.9)' stroke-linecap='round' stroke-miterlimit='10' stroke-width='2' d='M4 7h22M4 15h22M4 23h22'/%3e%3c/svg%3e");
    }

    /* ===== Search Bar ===== */
    .search-container {
      padding: var(--space-lg) 0;
      background: var(--color-white);
      border-bottom: 1px solid var(--color-gray-200);
      margin-bottom: var(--space-2xl);
    }

    .search-form {
      display: flex;
      gap: var(--space-md);
      flex-wrap: wrap;
    }

    .search-form input {
      flex: 1;
      min-width: 200px;
      padding: var(--space-md) var(--space-lg);
      border: 2px solid var(--color-gray-200);
      border-radius: var(--radius-lg);
      font-family: var(--font-family-sans);
      font-size: 1rem;
      transition: all 0.2s ease;
    }

    .search-form input:focus {
      outline: none;
      border-color: var(--color-primary);
      box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.1);
    }

    .search-form button {
      padding: var(--space-md) var(--space-xl);
      background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-primary-dark) 100%);
      color: var(--color-white);
      border: none;
      border-radius: var(--radius-lg);
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: var(--shadow-md);
      white-space: nowrap;
    }

    .search-form button:hover {
      box-shadow: var(--shadow-lg);
      transform: translateY(-2px);
    }

    .search-form button:active {
      transform: translateY(0);
    }

    .search-form button:focus {
      outline: none;
      box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.3);
    }

    /* ===== Main Content ===== */
    .main-content {
      min-height: 80vh;
      padding: var(--space-2xl) 0;
    }

    .page-header {
      margin-bottom: var(--space-2xl);
    }

    .page-header h1 {
      margin-bottom: var(--space-md);
    }

    .page-description {
      color: var(--color-gray-600);
      font-size: 1.1rem;
    }

    /* ===== Footer ===== */
    footer {
      background: var(--color-dark);
      color: var(--color-gray-300);
      padding: var(--space-xl) 0;
      margin-top: var(--space-3xl);
      border-top: 2px solid var(--color-primary);
    }

    footer a {
      color: var(--color-primary);
    }

    footer a:hover {
      color: var(--color-primary-light);
    }

    .footer-bottom {
      text-align: center;
      color: var(--color-gray-400);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: var(--space-md);
    }

    /* ===== Responsive Design ===== */
    @media (max-width: 768px) {
      h1 {
        font-size: 2rem;
      }

      h2 {
        font-size: 1.5rem;
      }

      .navbar-brand {
        font-size: 1.25rem;
        margin-right: var(--space-md);
      }

      .search-form {
        flex-direction: column;
      }

      .search-form input,
      .search-form button {
        width: 100%;
      }

      .main-content {
        padding: var(--space-xl) 0;
      }

      .footer-bottom {
        flex-direction: column;
        text-align: center;
      }
    }

    /* ===== Bootstrap Overrides ===== */
    .container {
      max-width: 1200px;
    }

    .container-fluid {
      padding-left: var(--space-lg);
      padding-right: var(--space-lg);
    }

    @media (max-width: 768px) {
      .container-fluid {
        padding-left: var(--space-md);
        padding-right: var(--space-md);
      }
    }

    /* ===== Utility Classes ===== */
    .text-muted {
      color: var(--color-gray-500) !important;
    }

    .text-primary {
      color: var(--color-primary) !important;
    }

    .badge {
      padding: var(--space-xs) var(--space-md);
      border-radius: var(--radius-full);
      font-size: 0.75rem;
      font-weight: 600;
    }

    .badge-primary {
      background-color: rgba(14, 165, 233, 0.15);
      color: var(--color-primary);
    }

    .badge-success {
      background-color: rgba(16, 185, 129, 0.15);
      color: var(--color-success);
    }

    .badge-warning {
      background-color: rgba(245, 158, 11, 0.15);
      color: var(--color-warning);
    }
  </style>

  <title>{% block title %}CryptoFinder - Discover Cryptocurrency Tokens{% endblock %}</title>
</head>

<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg">
    <div class="container-fluid">
      <a class="navbar-brand" href="/">
        <i class="fas fa-chart-line"></i> CryptoFinder
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link" href="{{ url_for('new_coins_today') }}">
              <i class="fas fa-rocket"></i> Recent
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="{{ url_for('all_coins') }}">
              <i class="fas fa-coins"></i> All Coins
            </a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <div class="main-content">
    {% block content %}{% endblock %}
  </div>

  <!-- Footer -->
  <footer>
    <div class="container">
      <div class="footer-bottom">
        <p>
          <strong>CryptoFinder</strong> - Discover the latest cryptocurrency tokens
        </p>
        <p>&copy; 2025 CryptoFinder. All rights reserved.</p>
      </div>
    </div>
  </footer>

  <!-- Bootstrap Bundle with Popper -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
